name: Sincronizar Google Agenda

on:
  schedule:
    # Rede de segurança a cada 10 minutos. O agendamento externo precisa ser
    # conferido separadamente; não há garantia de prazo no agendador do GitHub.
    # Não cancela um ciclo em andamento. O próximo disparo aguarda na fila.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}       # permite rodar manualmente pela aba Actions do GitHub, para testar

concurrency:
  group: gcal-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Apenas horários de controle; nenhum evento, cliente ou segredo no cache.
      - name: Recuperar controle de cota e leitura completa
        uses: actions/cache/restore@v5
        with:
          path: server-sync/.sync-control
          key: sync-control-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sync-control-v1-

      - name: Instalar dependências
        working-directory: server-sync
        run: npm ci --omit=dev

      - name: Testar sincronização
        working-directory: server-sync
        run: npm test

      - name: Rodar sincronização
        working-directory: server-sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node run-sync.cjs

      - name: Preservar controle para o próximo disparo
        if: always()
        uses: actions/cache/save@v5
        with:
          path: server-sync/.sync-control
          key: sync-control-v1-${{ github.run_id }}-${{ github.run_attempt }}
