name: Sincronizar Google Agenda

on:
  schedule:
    # A cada 10 minutos, independente de navegador aberto.
    #
    # Só é sustentável porque este repositório é PÚBLICO: nesse caso o GitHub
    # Actions é gratuito e ilimitado, e o consumo não desconta da cota de 2.000
    # minutos/mês. Se um dia o repositório voltar a ser privado, este cron precisa
    # voltar para '*/30' — em privado, 10 minutos dá ~4.400 execuções/mês (cada
    # uma cobrada como 1 minuto cheio, mesmo levando 25 segundos) e estoura a
    # cota antes da metade do mês, deixando a sincronização fora do ar.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}       # permite rodar manualmente pela aba Actions do GitHub, para testar

concurrency:
  group: gcal-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: server-sync
        run: npm install --omit=dev

      - name: Rodar sincronização
        working-directory: server-sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync
