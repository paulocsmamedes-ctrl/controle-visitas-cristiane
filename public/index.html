<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cristiane Imóveis — Controle de Visitas CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow-x:hidden;}
  
  :root {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --card-border: #CBD5E1;
    --ink: #0F172A;
    --ink-soft: #334155;
    --ink-faint: #64748B;
    
    --accent: #6366F1;
    --accent-fg: #FFFFFF;
    --accent-soft: #EEF2FF;
    --accent-dark: #4F46E5;
    --accent-ring: rgba(99, 102, 241, 0.2);

    --success: #10B981;
    --success-fg: #FFFFFF;
    --success-soft: #ECFDF5;
    --success-dark: #059669;

    --warn: #D97706;
    --warn-soft: #FFFBEB;
    --warn-dark: #B45309;

    --danger: #EF4444;
    --danger-soft: #FEF2F2;
    --danger-dark: #DC2626;

    --neutral-soft: #F1F5F9;
    --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
  }

  #app-root[data-theme="dark"] {
    --bg: #0B0F19;
    --card: #151C2C;
    --card-border: #2E3D59;
    --ink: #F8FAFC;
    --ink-soft: #E2E8F0;
    --ink-faint: #94A3B8;
    
    --accent: #818CF8;
    --accent-fg: #FFFFFF;
    --accent-soft: #1E1B4B;
    --accent-dark: #6366F1;
    --accent-ring: rgba(129, 140, 248, 0.35);

    --success: #34D399;
    --success-fg: #064E3B;
    --success-soft: #064E3B;
    --success-dark: #A7F3D0;

    --warn: #FBBF24;
    --warn-soft: #451A03;
    --warn-dark: #FDE68A;

    --danger: #F87171;
    --danger-soft: #451212;
    --danger-dark: #FCA5A5;

    --neutral-soft: #1E293B;
    --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.4);
    --shadow-md: 0 6px 16px 0 rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 14px 32px 0 rgba(0, 0, 0, 0.6);
  }

  *{box-sizing:border-box;}
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
    -webkit-font-smoothing: antialiased;
    color-scheme: light;
  }
  #app-root[data-theme="dark"] { 
    color-scheme: dark; 
  }

  /* Form & Input Contrast Overrides */
  input, select, textarea {
    font-family: inherit;
    color: var(--ink) !important;
    background-color: var(--card) !important;
    border: 1px solid var(--card-border) !important;
  }
  
  select option {
    background-color: var(--card) !important;
    color: var(--ink) !important;
  }

  #app-root[data-theme="dark"] select,
  #app-root[data-theme="dark"] select option {
    color: #F8FAFC !important;
    background-color: #151C2C !important;
  }

  /* App Shell & Layout */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }
  @media(min-width: 768px) { .wrap { padding: 0 32px 90px; } }

  /* Navbar Sticky */
  .navbar-sticky {
    position: sticky; top: 0; z-index: 100;
    background: rgba(248, 250, 252, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    transition: background .25s ease, border-color .25s ease;
  }
  #app-root[data-theme="dark"] .navbar-sticky {
    background: rgba(11, 15, 25, 0.90);
  }

  .nav-container {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  @media(min-width: 768px) { .nav-container { padding: 16px 32px; } }

  .brand-group { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px var(--accent-ring), 0 0 0 3px var(--accent-ring);
    flex-shrink: 0; position: relative; overflow: hidden; cursor: pointer;
    border: 2px solid var(--accent); padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .brand-logo svg { width: 24px; height: 24px; stroke-width: 2.2; }
  .brand-logo img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
    display: block; border-radius: 50%;
  }
  .brand-logo .brand-photo-overlay {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(15, 23, 42, 0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .18s ease; color: #fff;
  }
  .brand-logo .brand-photo-overlay svg { width: 18px; height: 18px; }
  .brand-logo:hover .brand-photo-overlay, .brand-logo:focus-visible .brand-photo-overlay { opacity: 1; }
  .brand-text h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.02em; line-height: 1.2; color: var(--ink); }
  .brand-text p { font-size: 12px; color: var(--ink-soft); margin: 2px 0 0; font-weight: 600; }

  .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Digital Clock */
  .digital-clock {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--neutral-soft);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md); padding: 7px 14px;
    box-shadow: var(--shadow-xs); flex-shrink: 0;
    transition: background .25s ease, border-color .25s ease;
  }
  .digital-clock-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); flex-shrink: 0; animation: digitalPulse 2s ease-in-out infinite; }
  .digital-clock-stack { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
  .digital-clock-label { font-size: 8px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-faint); }
  .digital-clock-time {
    font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;
    font-size: 16px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent-dark);
    text-shadow: 0 0 10px var(--accent-ring);
  }
  .digital-clock-colon { animation: digitalBlink 1s steps(1) infinite; }
  @keyframes digitalBlink { 50% { opacity: .25; } }
  @keyframes digitalPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .digital-clock-colon, .digital-clock-dot { animation: none; } }

  /* Badges */
  .badge-pill {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--accent-dark); background: var(--accent-soft);
    padding: 6px 12px; border-radius: 30px; letter-spacing: .3px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border: 1px solid rgba(129, 140, 248, 0.2);
  }
  .badge-pill.success { color: var(--success-dark); background: var(--success-soft); border-color: rgba(52, 211, 153, 0.25); }
  .badge-pill.warn { color: var(--warn-dark); background: var(--warn-soft); border-color: rgba(251, 191, 36, 0.25); }
  .badge-pill.danger { color: var(--danger-dark); background: var(--danger-soft); border-color: rgba(248, 113, 113, 0.25); }

  /* Theme Switch Button */
  .theme-toggle-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--card-border);
    padding: 8px 14px; border-radius: var(--radius-md); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
    box-shadow: var(--shadow-xs); transition: all .15s ease;
  }
  .theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .theme-toggle-btn svg { width: 16px; height: 16px; color: var(--accent); }

  /* Tabs Navigation Bar High-Contrast Redesign */
  .tabs-nav {
    display: flex; gap: 10px; margin: 24px 0 28px;
    border-bottom: 1px solid var(--card-border); padding-bottom: 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs-nav::-webkit-scrollbar { display: none; }
  
  .tab-btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 22px; border-radius: var(--radius-md);
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    background: var(--card); border: 1px solid var(--card-border); cursor: pointer;
    box-shadow: var(--shadow-xs); transition: all .15s ease;
    white-space: nowrap;
  }
  .tab-btn svg { width: 18px; height: 18px; color: var(--accent); }
  .tab-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }

  /* Explicit dark-theme override so inactive tabs never inherit a low-contrast color from browser defaults */
  #app-root[data-theme="dark"] .tab-btn { color: var(--ink) !important; background: var(--card) !important; border-color: var(--card-border) !important; }
  #app-root[data-theme="dark"] .tab-btn svg { color: var(--accent) !important; }
  #app-root[data-theme="dark"] .btn-ghost { color: var(--ink-soft) !important; }
  #app-root[data-theme="dark"] .btn-ghost:hover { color: var(--accent) !important; }

  /* Active Tab Pill High Contrast */
  .tab-btn.active {
    color: #FFFFFF !important; 
    background: linear-gradient(135deg, var(--accent), var(--accent-dark)) !important;
    border-color: var(--accent) !important; 
    font-weight: 800 !important; 
    box-shadow: 0 4px 16px var(--accent-ring) !important;
  }
  .tab-btn.active svg { color: #FFFFFF !important; }

  /* Buttons */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #FFFFFF !important; font-family: inherit; font-size: 13.5px; font-weight: 700;
    padding: 10px 20px; border-radius: var(--radius-md); border: none; cursor: pointer;
    box-shadow: 0 4px 14px var(--accent-ring); transition: all .15s ease;
  }
  .btn-primary:hover { opacity: 0.93; transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-ring); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary svg { width: 18px; height: 18px; stroke-width: 2.5; color: #FFFFFF; }

  .btn-outline {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); color: var(--ink); font-family: inherit;
    font-size: 12.5px; font-weight: 600; padding: 9px 15px; border-radius: var(--radius-md);
    border: 1px solid var(--card-border); cursor: pointer; box-shadow: var(--shadow-xs);
    transition: all .15s ease;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .btn-outline:active { transform: translateY(0); }
  .btn-outline svg { width: 15px; height: 15px; color: var(--accent); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--ink-soft); font-family: inherit;
    font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: var(--radius-sm);
    border: none; cursor: pointer; transition: all .15s ease; text-decoration: none;
  }
  .btn-ghost:hover { color: var(--accent); background: var(--neutral-soft); }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 22px 24px; margin-bottom: 24px; transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card-header-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .card h3 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; color: var(--ink); }
  .card h3 svg { width: 20px; height: 20px; color: var(--accent); }
  .card .sub { font-size: 13px; color: var(--ink-soft); margin: 4px 0 16px; line-height: 1.5; }

  /* Next Visit Highlight Card */
  .next-visit-card {
    background: linear-gradient(135deg, var(--card), var(--accent-soft));
    border: 1px solid var(--card-border); position: relative; overflow: hidden;
  }
  .next-visit-card::before {
    content: ''; position: absolute; top: -50px; right: -50px; width: 160px; height: 160px;
    border-radius: 50%; background: var(--accent-ring); filter: blur(40px); pointer-events: none;
  }
  .next-visit-body { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .clock-icon-wrap {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--accent); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px var(--accent-ring); flex-shrink: 0;
  }
  .clock-icon-wrap svg { width: 28px; height: 28px; color: #FFFFFF; }
  .next-visit-name { font-size: 16px; font-weight: 700; color: var(--ink); }
  .next-visit-sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .next-visit-when {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    padding: 5px 14px; border-radius: 20px; background: var(--accent); color: #FFFFFF;
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  }

  /* Stat Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
  @media(min-width: 768px) { .stats-grid { grid-template-columns: repeat(5, 1fr); } }
  
  .stat-card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-xs);
    padding: 18px 20px; transition: transform .15s ease, border-color .15s ease;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; }
  .stat-label svg { width: 16px; height: 16px; color: var(--accent); }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }

  /* Charts Grid */
  .charts-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
  @media(min-width: 900px) { .charts-grid { grid-template-columns: repeat(3, 1fr); } }
  
  .chart-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); padding: 20px 22px; }
  .chart-card h3 { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 16px; display: flex; align-items: center; gap: 7px; }
  
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 12.5px; }
  .bar-row .lbl { width: 95px; flex-shrink: 0; color: var(--ink-soft); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--neutral-soft); border-radius: 20px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 20px; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .bar-fill.success-color { background: var(--success); }
  .bar-count { width: 24px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; font-weight: 600; }
  
  .month-chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 10px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .month-bar { width: 100%; max-width: 28px; background: var(--accent); border-radius: 8px 8px 3px 3px; transition: height .4s ease, opacity .15s ease; cursor: pointer; }
  .month-bar:hover { opacity: .8; transform: scaleY(1.02); }
  .month-bar.active-month { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
  .month-lbl { font-size: 10.5px; color: var(--ink-soft); margin-top: 8px; font-family: 'IBM Plex Mono', monospace; text-transform: capitalize; font-weight: 500; }

  /* Followups & Today List */
  .followup-list { display: flex; flex-direction: column; gap: 10px; }
  .followup-item {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    background: var(--neutral-soft); border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 14px 16px; transition: border-color .15s ease;
  }
  .followup-actions { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; }
  .followup-item:hover { border-color: var(--accent); }
  .followup-main { flex: 1; min-width: 200px; }
  .followup-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .followup-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .followup-date {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600;
    padding: 4px 12px; border-radius: 20px; background: var(--card); color: var(--ink-soft);
    white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--card-border);
  }
  .followup-date.overdue { background: var(--danger-soft); color: var(--danger); border-color: rgba(248, 113, 113, 0.25); }
  .followup-date.today { background: var(--success-soft); color: var(--success); border-color: rgba(52, 211, 153, 0.25); }

  .followup-future { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--card-border); }
  .followup-future-item { font-size: 11px; color: var(--ink-soft); opacity: .75; }

  /* WhatsApp Button */
  .wa-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #25D366; color: #FFFFFF; text-decoration: none; font-weight: 700;
    font-family: inherit; font-size: 12px; padding: 8px 14px; border-radius: var(--radius-md);
    white-space: nowrap; border: none; cursor: pointer; transition: all .15s ease;
    box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
  }
  .wa-btn:hover { background: #128C7E; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35); }
  .wa-btn svg { width: 15px; height: 15px; fill: currentColor; }
  .wa-btn.mini { padding: 4px 10px; font-size: 11px; border-radius: var(--radius-sm); }

  .done-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
    padding: 8px 14px; border-radius: var(--radius-md);
    background: var(--card); border: 1px solid var(--card-border); color: var(--ink-soft);
    cursor: pointer; transition: all .15s ease; white-space: nowrap; flex-shrink: 0;
  }
  .done-btn svg { width: 13px; height: 13px; }
  .done-btn:hover { background: var(--success-soft); border-color: var(--success); color: var(--success); transform: translateY(-1px); }
  .done-btn:disabled { opacity: .5; cursor: default; transform: none; }

  .followup-done-btn {
    background: var(--card); border: 1px solid var(--card-border); color: var(--ink); font-weight: 600;
    font-size: 11.5px; padding: 7px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap;
    transition: all .15s ease;
  }
  .followup-done-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* Agenda Section */
  .sync-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .sync-status { font-size: 12px; color: var(--ink-soft); line-height: 1.5; display: block; margin-bottom: 14px; }
  .sync-status.err { color: var(--danger); font-weight: 600; }
  .sync-countdown { font-weight: 600; color: var(--accent); }
  .agenda-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .agenda-filters select {
    font-family: inherit; border: 1px solid var(--card-border); background: var(--card);
    padding: 7px 12px; border-radius: 20px; font-size: 12.5px; color: var(--ink); cursor: pointer; font-weight: 600;
  }
  .agenda-filters select:hover { border-color: var(--accent); }
  .agenda-list { display: flex; flex-direction: column; gap: 10px; }
  .agenda-item {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    background: var(--neutral-soft); border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 13px 16px; transition: all .15s ease;
  }
  .agenda-item.hot { border-color: var(--accent); background: var(--accent-soft); }
  .agenda-main { flex: 1; min-width: 200px; }

  function normalizeSearch(s){
    return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }
  function filterBairros(query){
    const words = normalizeSearch(query).split(/\s+/).filter(Boolean);
    if(!words.length) return BAIRROS_GOIANIA.slice(0,30);
    return BAIRROS_GOIANIA.filter(b=>{
      const nb = normalizeSearch(b);
      return words.every(w=> nb.includes(w));
    }).slice(0,30);
  }

    bairroDropdownEl.style.left = Math.round(rect.left) + 'px';

    activeBairroInput = input;

  function monthsForPeriod(granularity, value){
    if(!value || value==='nenhum') return null;
    if(granularity==='mes') return [Number(value)];
    const groups = PERIOD_GROUPS[granularity];
    const group = groups && groups[Number(value)-1];
    return group || null;
  }

  function periodValueOptions(granularity){
    if(granularity==='mes'){
      return MONTH_NAMES.map((name,i)=>({ value:String(i+1).padStart(2,'0'), label:name }));
    }
    const groups = PERIOD_GROUPS[granularity] || [];
    const label = PERIOD_LABELS[granularity];
    return groups.map((months,i)=>({
      value:String(i+1),
      label:(i+1)+'º '+label+' ('+MONTH_NAMES[months[0]-1].slice(0,3)+'-'+MONTH_NAMES[months[months.length-1]-1].slice(0,3)+')'
    }));

  function isHotEvent(ev){
    const hotVisits = visits.filter(v=>HOT_STATUSES.includes(v.status));
    if(!hotVisits.length) return false;
    const title = String(ev.titulo||'').toLowerCase();
    return hotVisits.some(v=>{
      const cliente = String(v.cliente||'').toLowerCase().trim();
      const imovel = String(v.imovel||'').toLowerCase().trim();
      return (cliente && title.includes(cliente)) || (imovel && title.includes(imovel));
    });
  }

  function loadGisScript(){
    return new Promise((resolve,reject)=>{
      if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = ()=>resolve();
      s.onerror = ()=>reject(new Error('Falha ao carregar o script de login do Google.'));
      document.head.appendChild(s);
    });
  }

  async function fetchCalendarIds(){
    const url = new URL('https://www.googleapis.com/calendar/v3/users/me/calendarList');
    url.searchParams.set('minAccessRole','reader');
    url.searchParams.set('showHidden','true');
    const res = await fetch(url, { headers: { Authorization: 'Bearer '+gcalAccessToken } });
    const data = await res.json();
    if(!res.ok){
      throw new Error((data.error && data.error.message) ? data.error.message : ('HTTP '+res.status));
    }
    return (data.items||[])
      .filter(c => !isHolidayCalendar(c))
      .map(c=>c.id);
  }

  function isHolidayCalendar(c){
    const id = String(c.id||'').toLowerCase();
    const summary = normalizeText(c.summary);
    const isHoliday = id.includes('#holiday@group.v.calendar.google.com') || summary.includes('feriad') || summary.includes('holiday');
    const isBirthdays = id.includes('addressbook#contacts@group.v.calendar.google.com') || id.includes('#contacts@group.v.calendar.google.com') || summary.includes('aniversari') || summary.includes('birthday');
    return isHoliday || isBirthdays;
  }

  const MAX_EVENTS_PER_CALENDAR = 1000;
  const SYNC_TIME_MIN = '2025-01-01T00:00:00Z';
  const SYNC_TIME_MAX = '2035-12-31T23:59:59Z';

  async function fetchEventsFromCalendar(calendarId){
    let events = [];
    let pageToken;
    do{
      const url = new URL('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calendarId)+'/events');
      url.searchParams.set('timeMin', SYNC_TIME_MIN);
      url.searchParams.set('timeMax', SYNC_TIME_MAX);
      url.searchParams.set('singleEvents','true');
      url.searchParams.set('orderBy','startTime');
      url.searchParams.set('maxResults','250');
      if(pageToken) url.searchParams.set('pageToken', pageToken);
      const res = await fetch(url, { headers: { Authorization: 'Bearer '+gcalAccessToken } });
      const data = await res.json();
      if(!res.ok) break;
      events = events.concat(data.items||[]);
      pageToken = data.nextPageToken;
    } while(pageToken && events.length < MAX_EVENTS_PER_CALENDAR);
    return events;
  }

  async function fetchGoogleEvents(){
    const calendarIds = await fetchCalendarIds();
    const rawByCalendar = await Promise.all(
      calendarIds.map(id => fetchEventsFromCalendar(id).catch(()=>[]))
    );

    const seen = new Set();
    const events = [];
    rawByCalendar.flat().forEach(ev=>{
      if(!ev.id || seen.has(ev.id)) return;
      seen.add(ev.id);
      const start = ev.start && (ev.start.dateTime || ev.start.date);
      const iso = start ? start.slice(0,10) : '';
      if(!iso) return;
      const hora = (ev.start && ev.start.dateTime) ? new Date(ev.start.dateTime).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
      events.push({ id: ev.id, titulo: ev.summary || '(sem título)', data: iso, hora, local: ev.location || '' });
    });

    agendaEvents = events;
    agendaSyncedAt = Date.now();
    nextAutoSyncAt = agendaSyncedAt + 10*60*1000;
    storageSet(AGENDA_KEY, JSON.stringify({events: agendaEvents, syncedAt: agendaSyncedAt}));
    const importResult = await importGoogleEventsIntoVisits(events);
    importResult.calendars = calendarIds.length;
    importResult.totalEvents = events.length;
    syncStatus = { loading:false, error:null, lastImport: importResult };
    render();
  }

  function normalizeText(s){
    return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }

  async function importGoogleEventsIntoVisits(events){
    const today = todayISO();
    let imported = 0, updated = 0, skipped = 0, removed = 0;

    const currentEventIds = new Set(events.map(ev=>ev.id));
    const toRemove = visits.filter(v => v.fromGoogle && (!normalizeText(v.imovel).includes('visita') || (v.sourceId && !currentEventIds.has(v.sourceId))));
    const removeIds = new Set(toRemove.map(v=>v.id));
    const remaining = visits.filter(v => !removeIds.has(v.id));

    const ops = [];
    toRemove.forEach(v => ops.push({type:'delete', id:v.id}));

    events.forEach(ev=>{
      if(!ev.data) return;
      const isVisita = normalizeText(ev.titulo).includes('visita');
      if(!isVisita){ skipped++; return; }
      const existing = remaining.find(v=>v.sourceId===ev.id);
      if(existing){
        if(existing.status==='Agendada' && ev.data < today){
          ops.push({type:'update', id:existing.id, data:{status:'Realizada'}});
          updated++;
        }
        return;
      }
      ops.push({type:'set', id:uid(), data:{
        sourceId: ev.id,
        fromGoogle: true,
        data: ev.data,
        imovel: ev.titulo,
        bairro: ev.local || '',
        cliente: '',
        telefone: '',
        status: ev.data < today ? 'Realizada' : 'Agendada',
        followup: '',
        obs: 'Importado do Google Agenda'
      }});
      imported++;
    });
    removed = toRemove.length;

    if(ops.length){
      try{
        await commitInChunks(ops, (batch, op)=>{
          if(op.type==='delete') batch.delete(doc(db,'visits',op.id));
          else if(op.type==='update') batch.update(doc(db,'visits',op.id), op.data);
          else batch.set(doc(db,'visits',op.id), op.data);
        });
      }catch(e){ console.error(e); }
    }
    return { imported, updated, skipped, removed };
  }

  function syncSummaryText(){

    let text = 'Última sincronização: '+new Date(agendaSyncedAt).toLocaleString('pt-BR');
    const r = syncStatus.lastImport;
    if(r){
      const scan = [];
      if(r.calendars!=null) scan.push(r.calendars+' calendário(s)');
      if(r.totalEvents!=null) scan.push(r.totalEvents+' evento(s) encontrado(s)');
      if(scan.length) text += ' · '+scan.join(', ');

      const parts = [];
      if(r.imported) parts.push(r.imported+' novas no registro');
      if(r.updated) parts.push(r.updated+' marcadas como realizada');
      if(r.removed) parts.push(r.removed+' removidas');
      if(r.skipped) parts.push(r.skipped+' ignorados');
      if(parts.length) text += ' · '+parts.join(', ');
    }
    return text;
  }

  function daysUntilLabel(iso){

  function requestGoogleToken(promptMode){
    return loadGisScript().then(()=> new Promise((resolve, reject)=>{
      if(!gcalTokenClient){
        gcalTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: gcalClientId,
          scope: GCAL_SCOPE,
          callback: ()=>{}
        });
      }
      let settled = false;
      const timeout = setTimeout(()=>{
        if(settled) return;
        settled = true;
        reject(new Error('Tempo esgotado ao tentar autenticar com o Google.'));
      }, 15000);
      gcalTokenClient.callback = (resp)=>{
        if(settled) return;
        settled = true;
        clearTimeout(timeout);
        if(resp.error){ reject(new Error(resp.error)); return; }
        gcalAccessToken = resp.access_token;
        gcalTokenExpiry = Date.now() + (resp.expires_in ? resp.expires_in*1000 : 3600000);
        resolve();
      };
      try{
        gcalTokenClient.requestAccessToken({ prompt: promptMode });
      }catch(err){
        if(!settled){ settled = true; clearTimeout(timeout); reject(err); }
      }
    }));
  }

  async function hashText(text){
    if(!window.crypto || !window.crypto.subtle){
      throw new Error('Este recurso exige que a página seja aberta via http(s), não direto do arquivo (file://).');
    }
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function handleBrandPhotoChange(file){
    if(!file.type.startsWith('image/')){ alert('Selecione um arquivo de imagem (JPG, PNG, etc).'); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 300;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        const x = (size - w) / 2;
        const y = -(h - size) * 0.2; // enquadra levemente para cima, destacando o rosto
        ctx.drawImage(img, x, y, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        brandPhoto = dataUrl;
        try{ storageSet(BRAND_PHOTO_KEY, dataUrl); }
        catch(err){ alert('Não foi possível salvar a foto (arquivo muito grande).'); }
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function followupState(iso){

    if(iso === todayISO()) return new Date().getHours() >= 12 ? 'overdue' : 'today';

  function filteredVisits(){
    if(filters.year==='nenhum' || filters.periodValue==='nenhum') return [];
    return visits.filter(v=>{
      if(filters.status && v.status !== filters.status) return false;
      if(filters.year && (!v.data || v.data.slice(0,4) !== filters.year)) return false;
      const periodMonths = monthsForPeriod(filters.granularity, filters.periodValue);
      if(periodMonths){
        const vMonth = v.data ? Number(v.data.slice(5,7)) : null;
        if(!vMonth || !periodMonths.includes(vMonth)) return false;
      }
      if(filters.q){
        const q = filters.q.toLowerCase();
        const hay = (v.imovel+' '+v.bairro+' '+v.bairro2+' '+v.cliente).toLowerCase();

  function computeStats(list){
    const today = todayISO();
    const total = list.length;
    const agendadas = list.filter(v=>v.status==='Agendada' && v.data && v.data>=today).length;
    const realizadas = list.filter(v=>v.data && v.data<today).length;
    const vendidos = list.filter(v=>v.status==='Vendido').length;
    const realizadasBase = list.filter(v=>v.status!=='Agendada').length;
    const conversao = realizadasBase>0 ? Math.round((vendidos/realizadasBase)*100) : 0;

    const byStatus = {};
    STATUSES.forEach(s=>byStatus[s]=0);
    list.forEach(v=>{ byStatus[v.status] = (byStatus[v.status]||0)+1; });

    const byBairro = {};
    list.forEach(v=>{
      const b = (v.bairro2||'').trim();
      if(!b) return;
      byBairro[b] = (byBairro[b]||0)+1;
    });
    const topBairros = Object.entries(byBairro).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const now = new Date();
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      const label = d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
      months.push({key,label});
    }
    const byMonth = months.map(m=>({
      key: m.key,
      label:m.label,
      count: list.filter(v=>monthKey(v.data)===m.key).length
    }));

    return {total, agendadas, realizadas, vendidos, conversao, byStatus, topBairros, byMonth};
  }

  function excelSerialToISO(n){
    const d = new Date(Math.round((n-25569)*86400*1000));
    const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,'0'), dd=String(d.getUTCDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }

  function parseDateFlexible(val){
    if(val===undefined || val===null || val==='') return '';
    if(val instanceof Date){
      const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,'0'), d=String(val.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+d;
    }
    if(typeof val === 'number') return excelSerialToISO(val);
    const s = String(val).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
    return '';
  }

  function matchStatus(val){
    const s = String(val||'').trim().toLowerCase();
    const found = STATUSES.find(st=>st.toLowerCase()===s);

  function findField(row, ...names){
    const keys = Object.keys(row);
    for(const name of names){
      const k = keys.find(k=>k.toLowerCase().replace(/[^a-z0-9áàâãéêíóôõúç]/gi,'').includes(name));
      if(k) return row[k];
    }
    return '';
  }

  async function importFile(file){
    try{

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wsName], {defval:''});
      if(!rows.length){
        ioMessage = {ok:false, text:'A planilha está vazia — nada para importar.'};
        render(); return;
      }
      const newRows = [];
      rows.forEach(row=>{
        const data = parseDateFlexible(findField(row,'data'));
        const imovel = findField(row,'imovel','imóvel');
        if(!data && !imovel) return;
        newRows.push({
          id: uid(),
          data,
          imovel,
          bairro: findField(row,'endereco','endereço'),
          bairro2: findField(row,'bairro'),
          cliente: findField(row,'cliente'),
          telefone: findField(row,'telefone','fone','celular'),
          status: matchStatus(findField(row,'status')),
          followup: parseDateFlexible(findField(row,'followup','retorno')),
          obs: findField(row,'observa','obs','nota')
        });
      });
      if(newRows.length){
        await commitInChunks(newRows, (batch, row)=>{
          const { id, ...data } = row;
          batch.set(doc(db,'visits',id), data);
        });
      }
      ioMessage = {ok:true, text: newRows.length+' visita(s) importada(s) com sucesso.'};
      render();
    }catch(e){
      ioMessage = {ok:false, text:'Não consegui ler esse arquivo. Confira se é um .xlsx, .xls ou .csv válido.'};
      render();
    }
  }

    const agendaHidden = agendaFilters.year==='nenhum' || agendaFilters.periodValue==='nenhum';

  function attachEvents(){
    // Modal events
    const openModalBtn = document.getElementById('btn-open-modal');
    if(openModalBtn) openModalBtn.addEventListener('click', ()=>{ 
      editingVisitId = null;
      isModalOpen = true; 
      render(); 
    });

    const closeModalBtn = document.getElementById('btn-close-modal');
    if(closeModalBtn) closeModalBtn.addEventListener('click', ()=>{ 
      isModalOpen = false; 
      editingVisitId = null;
      render(); 
    });

    const cancelModalBtn = document.getElementById('btn-cancel-modal');
    if(cancelModalBtn) cancelModalBtn.addEventListener('click', ()=>{ 
      isModalOpen = false; 
      editingVisitId = null;
      render(); 
    });

    const modalBackdrop = document.getElementById('visit-modal');
    if(modalBackdrop){
      modalBackdrop.addEventListener('click', (e)=>{
        if(e.target === modalBackdrop){ 
          isModalOpen = false; 
          editingVisitId = null;
          render(); 
        }
      });
    }

    // Tabs events
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeTab = btn.getAttribute('data-tab');
        render();
      });
    });

    // Edit button events in Table
    document.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const targetBtn = e.target.closest('[data-edit]');
        const id = targetBtn ? targetBtn.getAttribute('data-edit') : null;
        if(id){
          editingVisitId = id;
          isModalOpen = true;
          render();
        }
      });
    });

    // Form submit
    const form = document.getElementById('visit-form');
    if(form){
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(form);
        const entry = {
          data: fd.get('data'),
          imovel: fd.get('imovel'),
          bairro: fd.get('bairro'),
          bairro2: fd.get('bairro2'),
          cliente: fd.get('cliente'),
          telefone: fd.get('telefone'),
          status: fd.get('status'),
          obs: fd.get('obs'),
          followup: fd.get('followup')
        };
        try{
          if(editingVisitId){
            await updateDoc(doc(db, 'visits', editingVisitId), entry);
          } else {
            const id = uid();
            await setDoc(doc(db, 'visits', id), entry);
          }
          isModalOpen = false;
          editingVisitId = null;
          render();
        }catch(err){
          alert('Não foi possível salvar a visita: '+err.message);
        }
      });
    }

    // Filter events
    const fq = document.getElementById('f-q');
    if(fq) fq.addEventListener('input', (e)=>{ filters.q = e.target.value; render(); });
    
    const fstatus = document.getElementById('f-status');
    if(fstatus) fstatus.addEventListener('change', (e)=>{ filters.status = e.target.value; render(); });

    const fyear = document.getElementById('f-year');
    if(fyear) fyear.addEventListener('change', (e)=>{ filters.year = e.target.value; render(); });

    const fval = document.getElementById('f-period-value');
    if(fval) fval.addEventListener('change', (e)=>{ filters.periodValue = e.target.value; render(); });

    document.querySelectorAll('.month-bar[data-month]').forEach(bar=>{
      bar.addEventListener('click', ()=>{
        const key = bar.getAttribute('data-month');
        const [y, m] = key.split('-');
        if(filters.granularity==='mes' && filters.year===y && filters.periodValue===m){
          filters.year = ''; filters.periodValue = '';
        }else{
          filters.year = y; filters.granularity = 'mes'; filters.periodValue = m;
        }
        activeTab = 'visitas';
        render();
      });
    });

    const clearMonthBtn = document.getElementById('btn-clear-month-filter');
    if(clearMonthBtn) clearMonthBtn.addEventListener('click', ()=>{
      filters.year = ''; filters.granularity = 'mes'; filters.periodValue = ''; render();
    });

    // Top scrollbar synced with the table's horizontal scroll
    const scrollTopBar = document.getElementById('table-scroll-top');
    const scrollTopInner = document.getElementById('table-scroll-top-inner');
    const scrollMain = document.getElementById('table-scroll');
    if(scrollTopBar && scrollTopInner && scrollMain){
      const tableEl = scrollMain.querySelector('table');
      if(tableEl) scrollTopInner.style.width = tableEl.scrollWidth + 'px';
      let syncingScroll = false;
      scrollTopBar.addEventListener('scroll', ()=>{
        if(syncingScroll) return;
        syncingScroll = true; scrollMain.scrollLeft = scrollTopBar.scrollLeft; syncingScroll = false;
      });
      scrollMain.addEventListener('scroll', ()=>{
        if(syncingScroll) return;
        syncingScroll = true; scrollTopBar.scrollLeft = scrollMain.scrollLeft; syncingScroll = false;
      });
    }

    // Table edit events
    document.querySelectorAll('.status-select').forEach(sel=>{
      sel.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        if(newStatus === 'Vendido'){ justStampedId = id; }
        try{
          await updateDoc(doc(db,'visits',id), {status:newStatus});
        }catch(err){
          alert('Não foi possível atualizar o status: '+err.message);
        }
      });
    });

    document.querySelectorAll('.done-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = btn.getAttribute('data-id');
        btn.disabled = true;
        try{
          await updateDoc(doc(db,'visits',id), {status:'Realizada'});
        }catch(err){
          alert('Não foi possível marcar como realizada: '+err.message);
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const targetBtn = e.target.closest('[data-del]');
        const id = targetBtn ? targetBtn.getAttribute('data-del') : null;
        if(id && confirm('Excluir esta visita do registro?')){
          try{
            await deleteDoc(doc(db,'visits',id));
          }catch(err){
            alert('Não foi possível excluir: '+err.message);
          }
        }
      });
    });

    const btnTemplate = document.getElementById('btn-template');
    if(btnTemplate) btnTemplate.addEventListener('click', downloadTemplate);

    const btnExport = document.getElementById('btn-export');
    if(btnExport) btnExport.addEventListener('click', exportData);

    const fileImport = document.getElementById('file-import');
    if(fileImport) fileImport.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(file) await importFile(file);
    });

    const themeBtn = document.getElementById('theme-toggle');
    if(themeBtn) themeBtn.addEventListener('click', toggleTheme);

    const brandPhotoBtn = document.getElementById('brand-photo-btn');
    const brandPhotoInput = document.getElementById('brand-photo-input');
    if(brandPhotoBtn && brandPhotoInput){
      brandPhotoBtn.addEventListener('click', ()=> brandPhotoInput.click());
      brandPhotoInput.addEventListener('change', (e)=>{
        const file = e.target.files[0];
        if(file) handleBrandPhotoChange(file);
        e.target.value = '';
      });
    }

    const syncBtn = document.getElementById('btn-sync-agenda');
    if(syncBtn) syncBtn.addEventListener('click', syncGoogleAgenda);

    const disconnectBtn = document.getElementById('btn-disconnect-agenda');
    if(disconnectBtn) disconnectBtn.addEventListener('click', disconnectGoogleCalendar);

    const resetSyncBtn = document.getElementById('btn-reset-sync');
    if(resetSyncBtn) resetSyncBtn.addEventListener('click', resetGoogleSync);

    const toggleSettingsBtn = document.getElementById('btn-toggle-gcal-settings');
    if(toggleSettingsBtn) toggleSettingsBtn.addEventListener('click', toggleGcalSettings);

    const changePassBtn = document.getElementById('btn-change-gcal-pass');
    if(changePassBtn) changePassBtn.addEventListener('click', changeGcalPassword);

    const agendaYearSel = document.getElementById('agenda-f-year');
    if(agendaYearSel) agendaYearSel.addEventListener('change', (e)=>{ agendaFilters.year = e.target.value; render(); });
    const agendaGranularitySel = document.getElementById('agenda-f-granularity');
    if(agendaGranularitySel) agendaGranularitySel.addEventListener('change', (e)=>{ agendaFilters.granularity = e.target.value; agendaFilters.periodValue = ''; render(); });
    const agendaPeriodValueSel = document.getElementById('agenda-f-period-value');
    if(agendaPeriodValueSel) agendaPeriodValueSel.addEventListener('change', (e)=>{ agendaFilters.periodValue = e.target.value; render(); });

    const saveGcalBtn = document.getElementById('btn-save-gcal-id');
    if(saveGcalBtn) saveGcalBtn.addEventListener('click', saveGcalClientId);

    document.querySelectorAll('.followup-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-id');
        try{
          await updateDoc(doc(db,'visits',id), {followup: e.target.value});
        }catch(err){
          alert('Não foi possível atualizar o follow-up: '+err.message);
        }
      });
    });

    document.querySelectorAll('.telefone-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-id');
        try{
          await updateDoc(doc(db,'visits',id), {telefone: e.target.value.trim()});
        }catch(err){
          alert('Não foi possível atualizar o telefone: '+err.message);
        }
      });
    });

    document.querySelectorAll('.cliente-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-id');
        try{
          await updateDoc(doc(db,'visits',id), {cliente: e.target.value.trim()});
        }catch(err){
          alert('Não foi possível atualizar o cliente: '+err.message);
        }
      });
    });

    document.querySelectorAll('.bairro2-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-id');
        if(!id) return;
        try{
          await updateDoc(doc(db,'visits',id), {bairro2: e.target.value.trim()});
        }catch(err){
          alert('Não foi possível atualizar o bairro: '+err.message);
        }
      });
    });

    document.querySelectorAll('.bairro-search').forEach(inp=>{
      inp.addEventListener('focus', ()=>{ renderBairroDropdown(inp); });
      inp.addEventListener('input', ()=>{ renderBairroDropdown(inp); });
      inp.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape'){ closeAllBairroDropdowns(); }
      });
    });

    document.querySelectorAll('[data-followup-done]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const targetBtn = e.target.closest('[data-followup-done]');
        const id = targetBtn ? targetBtn.getAttribute('data-followup-done') : null;
        if(id) clearFollowup(id);
      });
    });
  }

  async function autoSyncIfConnected(){
    if(!nextAutoSyncAt || Date.now() < nextAutoSyncAt) return;
    if(!gcalClientId || !storageGet(GCAL_CONNECTED_KEY)) return;
    if(syncStatus.loading || autoSyncInFlight) return;

    autoSyncInFlight = true;
    try{
      if(!gcalAccessToken || Date.now() >= gcalTokenExpiry - 30000){
        await requestGoogleToken(''); // renovação silenciosa, sem popup — só funciona se a sessão do Google ainda estiver ativa
      }
      await fetchGoogleEvents();
    }catch(e){
      gcalAccessToken = null;
      gcalTokenExpiry = 0;
      nextAutoSyncAt = null;
      syncStatus = { loading:false, error:'A conexão com o Google expirou. Clique em "Sincronizar agora" para reativar a atualização automática.' };
      render();
    }finally{
      autoSyncInFlight = false;
    }
  }

  async function tryAutoReconnectGoogle(){
    if(!gcalClientId || !storageGet(GCAL_CONNECTED_KEY)) return;
    try{
      await requestGoogleToken('');
      await fetchGoogleEvents();
    }catch(e){
      syncStatus = { loading:false, error:null, notice: 'Não consegui reconectar automaticamente ao Google Agenda. Clique em "Conectar Google Agenda" para reativar a sincronização automática.' };
      render();
    }
  }

  function updateSyncCountdown(){
    const el = document.getElementById('sync-countdown');
    if(!el) return;
    if(!gcalAccessToken || !nextAutoSyncAt){ el.textContent = ''; return; }
    const msLeft = nextAutoSyncAt - Date.now();
    if(msLeft <= 0){ el.textContent = 'Atualizando agora...'; return; }
    const totalSeconds = Math.max(0, Math.ceil(msLeft / 1000) - 1);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    const timeStr = minutes+':'+String(seconds).padStart(2,'0');
    el.textContent = 'Próxima atualização automática em '+timeStr;
  }

  function updateBrandClock(){
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
    const dH = document.getElementById('digital-clock-h');
    const dM = document.getElementById('digital-clock-m');
    const dS = document.getElementById('digital-clock-s');
    if(dH) dH.textContent = String(now.getHours()).padStart(2,'0');
    if(dM) dM.textContent = String(now.getMinutes()).padStart(2,'0');
    if(dS) dS.textContent = String(now.getSeconds()).padStart(2,'0');
    updateSyncCountdown();
  }

  document.addEventListener('mousedown', (e)=>{
    if(!e.target.closest('.bairro-combo') && !e.target.closest('.bairro-dropdown')) closeAllBairroDropdowns();
  });
  window.addEventListener('scroll', closeAllBairroDropdowns, true);
  window.addEventListener('resize', closeAllBairroDropdowns);

  loadVisits();
  tryAutoReconnectGoogle();
  setInterval(autoSyncIfConnected, 1000);
  updateBrandClock();
  setInterval(updateBrandClock, 1000);
})();
</script>
</body>
</html>
